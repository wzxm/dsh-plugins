# MySQL MCP bridge. Keep credentials outside this file.
- insert:
    - id: dsh-mysql-authorization
      name: '@wzxm/dsh-mysql'
      config:
        enabled: true
        allowInsert: !!js process.env.DSH_MYSQL_ALLOW_INSERT === 'true'
        allowUpdate: !!js process.env.DSH_MYSQL_ALLOW_UPDATE === 'true'
        allowDelete: !!js process.env.DSH_MYSQL_ALLOW_DELETE === 'true'
        allowAlter: !!js process.env.DSH_MYSQL_ALLOW_ALTER === 'true'
        allowTruncate: !!js process.env.DSH_MYSQL_ALLOW_TRUNCATE === 'true'
        allowDrop: !!js process.env.DSH_MYSQL_ALLOW_DROP === 'true'
    - id: dsh-mysql-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: mysql
        transport: stdio
        command: npx
        args: ['-y', '@benborla29/mcp-server-mysql']
        env: !!js ({
          MYSQL_HOST: process.env.DSH_MYSQL_HOST ?? '',
          MYSQL_PORT: process.env.DSH_MYSQL_PORT ?? '',
          MYSQL_USER: process.env.DSH_MYSQL_USER ?? '',
          MYSQL_PASSWORD: process.env.DSH_MYSQL_PASSWORD ?? '',
          MYSQL_DATABASE: process.env.DSH_MYSQL_DATABASE ?? '',
        })
        failOnStartupError: true
